<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6c948"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>Notas+</title></head><body><header><div class="brand"><span class="mark">✦</span><strong>Notas+</strong></div><nav><button id="theme" aria-label="Mudar tema">◐</button><button id="export">⇩ Exportar</button><label class="filebtn">⇧ Importar<input id="import" type="file" accept=".json,application/json" hidden></label></nav></header><main><section class="hero"><div><small>AS TUAS IDEIAS, SEM LIMITES</small><h1>Guarda o que importa.</h1><p>Privado, offline e sempre contigo. Sem contas nem anúncios.</p></div><div class="counter"><strong id="count">0</strong><span>notas</span></div></section><div class="toolbar"><input id="search" type="search" placeholder="Pesquisar notas e etiquetas…"><button id="new" class="primary">＋ Nova nota</button></div><div class="filters"><button data-filter="active" class="selected">Todas</button><button data-filter="pinned">Fixadas</button><button data-filter="archived">Arquivo</button><button data-filter="deleted">Lixo</button></div><section id="notes" class="notes"></section><div id="empty" class="empty" hidden><div>✎</div><h2>Nenhuma nota por aqui</h2><p>Começa por guardar uma ideia.</p></div></main><dialog id="editor"><form id="note-form"><div class="dialog-head"><h2 id="heading">Nova nota</h2><button type="button" id="close">✕</button></div><input id="title" maxlength="160" placeholder="Título" aria-label="Título"><textarea id="content" rows="8" placeholder="Escreve a tua nota…" aria-label="Conteúdo"></textarea><label class="field">Etiquetas (separadas por vírgulas)<input id="tags" placeholder="Pessoal, Trabalho"></label><div id="colors" class="colors"></div><label class="pin"><input type="checkbox" id="pinned"> Fixar nota</label><div class="actions"><button type="button" id="delete" class="danger">Eliminar</button><button type="button" id="archive">Arquivar</button><button type="submit" class="primary">Guardar</button></div></form></dialog><div id="toast" role="status"></div><footer>Notas+ · Open source · Os dados ficam neste dispositivo · <button id="help">Como funciona?</button></footer><script src="./app.js" defer></script></body></html>
